name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --project-name schedule_app --org com.ahmed.schedule .
      - run: python3 patch.py
      - name: fixed signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
      - name: adhan sound
        run: |
          if [ -f sounds/adhan.mp3 ]; then
            mkdir -p android/app/src/main/res/raw
            cp sounds/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
            echo "const hasAdhan = true;" > lib/adhan_flag.dart
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: schedule-apk, path: build/app/outputs/flutter-apk/app-release.apk }
